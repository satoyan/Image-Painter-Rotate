name: image_painter_rotate
description: A flutter package for drawing over images. Supports rotating, color,
  strokeWidth, different paintModes and exporting image.
version: 1.0.4
homepage: https://github.com/satoyan/yellowQ-Flutter-Image-Painter

environment:
  sdk: ">=3.6.1 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  build_runner: ^2.11.0
  build_test: ^3.5.6
